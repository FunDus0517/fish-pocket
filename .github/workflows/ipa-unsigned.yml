name: ipa-unsigned

# Build fish-pocket from source on a GitHub-hosted macOS runner and produce an
# UNSIGNED .ipa for sideloading. Mirrors .github/workflows/ios-build.yml for the
# dependency/vendor steps, then archives for a device with signing disabled and
# packages Payload/ by hand (Xcode's export needs a signing team).
on:
  push:
    branches: [ipa-build, ipa-build2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v5
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      - name: Cache Python
        id: python
        uses: actions/cache@v5
        with:
          path: |
            vendor/python/ios
            vendor/python/rooted
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Fetch Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/fetch-python.sh

      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v5
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/ios-arm64-simulator
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: vendor/ffmpeg/FFmpeg.xcframework
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.sh', 'scripts/build-ffmpeg.sh', 'native/ffmpeg/**') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg.sh

      - name: Install xcodegen
        run: |
          command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen --version

      - name: Assemble engine
        run: scripts/build-engine.sh

      - name: Generate project
        working-directory: app
        run: xcodegen generate --quiet

      # arm64 device slice only: the vendored xcframeworks carry arm64 only.
      # Signing is off here, so the archive itself needs no team or profile.
      - name: Archive (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DshIOS.xcarchive \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            OTHER_LDFLAGS="$(inherited) -Wl,-no_fixup_chains" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      # On-device signers (Sideloadly, Chinese on-device signers and friends) replace an existing
      # signature; they fail on a binary that has none, because they have to grow
      # the __LINKEDIT signature slot themselves (CodeDirectory vs Mach-O mismatch).
      # Ad-hoc signing every nested binary here leaves a valid CodeDirectory with
      # room in it, so re-signing is a straight replacement.
      - name: Ad-hoc sign
        working-directory: app
        run: |
          set -euo pipefail
          APP="build/DshIOS.xcarchive/Products/Applications/DshIOS.app"
          find "$APP/Frameworks" -maxdepth 1 -name '*.framework' -print0 |
            while IFS= read -r -d '' fw; do codesign --force --sign - --timestamp=none "$fw"; done
          for ex in "$APP"/PlugIns/*.appex; do
            if [ -d "$ex" ]; then codesign --force --sign - --timestamp=none "$ex"; fi
          done
          if [ -d "$APP/Watch/DshWatch.app" ]; then
            codesign --force --sign - --timestamp=none "$APP/Watch/DshWatch.app"
          fi
          codesign --force --sign - --timestamp=none "$APP"
          echo "== main app signature =="
          codesign -dv "$APP" 2>&1 | sed -n '1,8p'
          echo "== deep verify =="
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package IPA
        working-directory: app
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml | head -1)"
          BUILD="$(sed -n 's/.*CURRENT_PROJECT_VERSION: "\(.*\)"/\1/p' project.yml | head -1)"
          APP="build/DshIOS.xcarchive/Products/Applications/DshIOS.app"
          echo "packaging $APP (version $VERSION build $BUILD)"
          test -d "$APP"
          rm -rf build/Payload build/*.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          IPA="$GITHUB_WORKSPACE/DSH-$VERSION-$BUILD-nofixup-unsigned.ipa"
          ( cd build && ditto -c -k --sequesterRsrc --keepParent Payload "$IPA" )
          ls -lh "$IPA"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"

      - name: Inspect package
        continue-on-error: true
        working-directory: app
        run: |
          set -uo pipefail
          APP="build/DshIOS.xcarchive/Products/Applications/DshIOS.app"
          echo "=== app size ==="
          du -sh "$APP"
          echo "=== top level ==="
          ls "$APP"
          echo "=== Info.plist (key fields) ==="
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion CFBundleDisplayName MinimumOSVersion CFBundleDevelopmentRegion DshURLScheme DshAppGroup FishPocketAPIURL LSMinimumSystemVersion; do
            printf '%s = ' "$k"; /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null || echo "(missing)"
          done
          echo "=== main binary ==="
          lipo -info "$APP/DshIOS" || true
          echo "=== Frameworks ==="
          ls "$APP/Frameworks" 2>/dev/null || true
          echo "=== PlugIns / Watch ==="
          ls "$APP/PlugIns" 2>/dev/null || true
          ls "$APP/Watch" 2>/dev/null || true
          echo "=== engine + python payload ==="
          du -sh "$APP/nodejs-project" "$APP/python" 2>/dev/null || true
          echo "=== localization ==="
          ls "$APP"/*.lproj 2>/dev/null | head || true
          echo "=== signature ==="
          codesign -dv "$APP" 2>&1 | sed -n '1,8p' || true
          codesign --verify --strict "$APP" && echo "signature verifies"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: fish-pocket-ipa
          path: |
            DSH-*.ipa
            DSH-*.ipa.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
